<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Heart 💗</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #05060a; }
    #c { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H, cx, cy, scale, bottomY;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    // ----- phương trình trái tim -----
    function heartPoint(t) {
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      // pha trộn với vòng tròn -> trái tim tròn trịa, bớt nhọn
      const round = 0.30;                 // 0 = tim nhọn, 1 = tròn xoe
      const R = 15, yc = -3;
      x = x * (1 - round) + (R * Math.sin(t)) * round;
      y = y * (1 - round) + (yc + R * Math.cos(t)) * round;
      return [x, y];
    }

    // ----- tạo các hạt lấp đầy trái tim -----
    const N = 1600;
    let particles = [];
    function buildParticles() {
      particles = [];
      for (let i = 0; i < N; i++) {
        const t = Math.random() * Math.PI * 2;
        const [hx, hy] = heartPoint(t);
        const f = Math.sqrt(Math.random());        // lệch ra rìa cho sáng viền
        const sgn = Math.random() < 0.5 ? -1 : 1;
        particles.push({
          bx: hx * f,
          by: hy * f,
          bz: sgn * 8.5 * Math.sqrt(Math.max(0, 1 - f * f)),  // độ phồng -> trái tim 3D mũm mĩm
          edge: f,                                  // càng gần rìa càng sáng
          phase: Math.random() * Math.PI * 2,
          spd: 0.6 + Math.random() * 1.4,
          hue: 330 + Math.random() * 20,            // hồng -> đỏ magenta
          a0: Math.random() * Math.PI * 2,          // góc xuất phát khi xoáy
          r0: 0.16 + Math.random() * 0.36,          // bán kính xoáy (theo cạnh ngắn màn hình)
          rot: 0.7 + Math.random() * 1.0,           // tốc độ quay
          petal: 3 + Math.floor(Math.random() * 4), // số "cánh" gợn sóng
          wob: 0.8 + Math.random() * 1.6,           // tốc độ uốn lượn
          dir: Math.random() < 0.3 ? -1 : 1,        // chiều quay (có hạt ngược cho rối rắm đẹp)
        });
      }
    }

    // ----- bụi rơi (nối tim với bóng phản chiếu) -----
    const DUST = 140;
    let dust = [];
    function buildDust() {
      dust = [];
      for (let i = 0; i < DUST; i++) dust.push(spawnDust(true));
    }
    function spawnDust(initial) {
      return {
        x: (Math.random() - 0.5) * 24,
        y: (Math.random() * (initial ? 40 : 2)) - 2,
        vy: 6 + Math.random() * 14,
        vx: (Math.random() - 0.5) * 4,
        life: Math.random(),
        hue: Math.random() < 0.5 ? 185 : 320,
      };
    }

    function resize() {
      W = canvas.width = Math.floor(innerWidth * DPR);
      H = canvas.height = Math.floor(innerHeight * DPR);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      cx = W / 2;
      cy = H * 0.40;
      scale = Math.min(W, H) * 0.5 / 34;            // vừa màn hình (responsive)
      bottomY = cy + 17 * scale;                    // đáy trái tim
    }
    addEventListener('resize', resize);

    // nhịp tim lub-dub
    function pulse(tt) {
      const x = (tt % 1.0);
      const b1 = Math.exp(-Math.pow((x - 0.0) / 0.055, 2));
      const b2 = Math.exp(-Math.pow((x - 0.17) / 0.065, 2)) * 0.65;
      return 1 + 0.11 * (b1 + b2);
    }

    function dot(x, y, r, hue, a) {
      ctx.fillStyle = `hsla(${hue},100%,62%,${a})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      ctx.fillStyle = `hsla(${hue},100%,58%,${a * 0.22})`;   // quầng sáng
      ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 6.283); ctx.fill();
    }

    function frame(now) {
      const t = now / 1000;
      const s = pulse(t * 1.05) * scale;
      const rCore = Math.max(1, scale * 0.14);

      // nền tối + chút vệt mờ cho lung linh
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(5,6,10,0.38)';
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';

      // chu kỳ: xoáy tụ lại -> giữ & đập -> tan ra xoáy -> lặp
      const CYCLE = 9.0;
      const ct = t % CYCLE;
      let form;
      if (ct < 3)      form = ct / 3;              // tụ thành tim
      else if (ct < 7) form = 1;                   // giữ nguyên
      else             form = 1 - (ct - 7) / 2;    // tan ra
      const e = form * form * (3 - 2 * form);      // smoothstep cho mượt
      const md = Math.min(W, H);

      // --- hạt: xoáy vòng rồi biến thành trái tim ---
      const F = 70;                                 // tiêu cự (phối cảnh 3D)
      const rotY = t * 0.9;                         // xoay quanh trục dọc
      const tilt = -0.16 + Math.sin(t * 0.5) * 0.06;// nghiêng + lắc lư nhẹ
      const cry = Math.cos(rotY), sry = Math.sin(rotY);
      const ctl = Math.cos(tilt), stl = Math.sin(tilt);
      for (const p of particles) {
        const sh = 1 + 0.05 * Math.sin(t * p.spd * 3 + p.phase);
        // --- toạ độ 3D trong trái tim: xoay + nghiêng + phối cảnh ---
        const X = p.bx * sh, Y = p.by * sh, Z = p.bz * sh;
        const x1 = X * cry - Z * sry;               // xoay quanh trục Y
        const z1 = X * sry + Z * cry;
        const y2 = Y * ctl - z1 * stl;              // nghiêng quanh trục X
        const z2 = Y * stl + z1 * ctl;
        const persp = F / (F - z2);                 // gần to, xa nhỏ
        const hx = cx + x1 * s * persp;
        const hy = cy - y2 * s * persp;
        // --- vị trí khi đang xoáy: cánh hoa gợn sóng + trôi lượn ---
        const ang = p.a0 + t * p.rot * p.dir;
        const wob = 1 + 0.34 * Math.sin(ang * p.petal + t * p.wob + p.phase);
        const rad = p.r0 * md * wob * (1.0 - 0.12 * e);
        const sx = cx + Math.cos(ang) * rad + Math.sin(t * 0.8 + p.phase) * md * 0.04;
        const sy = cy + Math.sin(ang) * rad * 0.92 + Math.cos(t * 0.6 + p.a0) * md * 0.04;
        const x = sx + (hx - sx) * e;              // pha trộn xoáy -> tim
        const y = sy + (hy - sy) * e;

        // độ sáng & kích thước theo chiều sâu -> nổi khối 3D
        const depthShade = 1 + (Math.min(Math.max(persp, 0.7), 1.4) - 1) * e;
        const a = (0.3 + 0.6 * p.edge) * (0.65 + 0.35 * Math.sin(t * p.spd * 4 + p.phase)) * depthShade;
        dot(x, y, rCore * (0.8 + p.edge * 0.6) * depthShade, p.hue, a);

        // --- bóng phản chiếu cyan (chỉ khi đã thành tim) ---
        if (e > 0.6) {
          const ry = bottomY + (bottomY - y) * 0.95;
          const depth = ry - bottomY;
          if (depth > 0) {
            const spread = depth * 0.5;
            const rx = x + Math.sin(t * p.spd + p.phase) * spread;
            const fade = Math.max(0, 1 - depth / (24 * scale));
            if (fade > 0.03)
              dot(rx, ry + Math.sin(t * p.spd * 2 + p.phase) * 4 * scale,
                  rCore * 0.8, 185 + Math.sin(p.phase) * 10, a * fade * 0.5 * (e - 0.6) / 0.4);
          }
        }
      }

      // --- bụi rơi (mờ dần khi tan) ---
      for (const d of dust) {
        d.y += d.vy * 0.016;
        d.x += d.vx * 0.016;
        d.life += 0.012;
        const x = cx + d.x * scale;
        const y = bottomY + d.y * scale;
        const a = Math.max(0, 1 - d.life) * 0.8 * Math.max(0, e);
        if (d.life >= 1 || y > bottomY + 26 * scale) Object.assign(d, spawnDust(false));
        else if (a > 0.02) dot(x, y, rCore * 0.6, d.hue, a);
      }

      requestAnimationFrame(frame);
    }

    resize();
    buildParticles();
    buildDust();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
