<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trái tim màu mè 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      /* nền gradient tự đổi màu cho màu mè */
      background: linear-gradient(135deg, #ffdde1, #ee9ca7, #c3a0ff, #a0e9ff, #ffd3a0);
      background-size: 400% 400%;
      animation: bgShift 14s ease infinite;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .scene { perspective: 1200px; position: relative; }

    .box {
      --h: 340;                       /* màu tim (hue), đổi mỗi lần bấm */
      position: relative;
      width: 300px;
      height: 280px;
      cursor: pointer;
      transform-style: preserve-3d;
    }
    .box:not(.open) { animation: beat 1.2s infinite ease-in-out; }

    /* ===== Chữ L bên trong ===== */
    .letter {
      position: absolute;
      inset: 0;
      display: flex; justify-content: center; align-items: center;
      z-index: 1;
      font-family: 'Great Vibes', cursive;
      font-size: 170px;
      color: #fff;
      text-shadow: 0 0 18px #fff, 0 6px 18px rgba(226,60,109,.6), 0 0 40px #ff6ad5;
      opacity: 0;
      transform: scale(.2) translateY(10px);
      transition: opacity .5s ease .35s, transform .6s cubic-bezier(.34,1.56,.64,1) .35s;
    }
    .box.open .letter { opacity: 1; transform: scale(1) translateY(0); }

    /* ===== Hai nửa trái tim (nắp) ===== */
    .half {
      position: absolute; inset: 0; z-index: 2;
      backface-visibility: hidden;
      transition: transform .9s cubic-bezier(.65,0,.35,1);
    }
    .half.left  { clip-path: inset(0 50% 0 0); transform-origin: left center; }
    .half.right { clip-path: inset(0 0 0 50%); transform-origin: right center; }
    .box.open .half.left  { transform: rotateY(-155deg); }
    .box.open .half.right { transform: rotateY(155deg); }

    .heart { position: absolute; top: 20px; left: 20px; width: 260px; height: 234px; }
    .heart::before, .heart::after {
      content: "";
      position: absolute; top: 0;
      width: 130px; height: 208px;
      background: linear-gradient(145deg,
                   hsl(var(--h), 100%, 72%),
                   hsl(var(--h), 95%, 55%));
      border-radius: 130px 130px 0 0;
      box-shadow: inset 0 -8px 20px rgba(0,0,0,.12);
      transition: background .3s;
    }
    .heart::before { left: 130px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .heart::after  { left: 0;     transform: rotate(45deg);  transform-origin: 100% 100%; }

    /* đốm lấp lánh quanh chữ L khi mở */
    .spark {
      position: absolute; z-index: 3; font-size: 22px;
      opacity: 0; pointer-events: none;
    }
    .box.open .spark { animation: twinkle 1.4s ease-in-out infinite; }
    .spark:nth-of-type(1){ top: 30px;  left: 60px;  animation-delay: .1s; }
    .spark:nth-of-type(2){ top: 40px;  right: 55px; animation-delay: .5s; }
    .spark:nth-of-type(3){ bottom: 70px; left: 80px; animation-delay: .8s; }
    .spark:nth-of-type(4){ bottom: 90px; right: 70px; animation-delay: .3s; }
    @keyframes twinkle {
      0%,100% { opacity: 0; transform: scale(.4) rotate(0); }
      50%     { opacity: 1; transform: scale(1.1) rotate(20deg); }
    }

    /* thanh tiến trình trái tim nhỏ */
    .dots {
      position: absolute; bottom: -46px; left: 0; width: 100%;
      display: flex; justify-content: center; gap: 8px;
      font-size: 22px; filter: grayscale(.2);
    }
    .dots span { transform: scale(.8); transition: transform .3s; opacity: .55; }
    .dots span.on { opacity: 1; animation: pop .4s ease; }
    @keyframes pop {
      0% { transform: scale(.8); } 60% { transform: scale(1.6); } 100% { transform: scale(1.1); }
    }

    /* dòng chữ tình yêu khi mở */
    .love-text {
      position: absolute; bottom: -92px; left: 0; width: 100%;
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: 26px; color: #fff;
      text-shadow: 0 2px 8px rgba(226,60,109,.6);
      opacity: 0; transform: translateY(8px);
      transition: opacity .5s ease .6s, transform .5s ease .6s;
      pointer-events: none;
    }
    .box.open .love-text { opacity: 1; transform: translateY(0); }

    .hint {
      position: absolute; bottom: -74px; left: 0; width: 100%;
      text-align: center; color: #fff; font-size: 15px;
      letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.2);
      animation: pulse 1.4s infinite; transition: opacity .3s;
    }
    .box.open .hint { opacity: 0; }

    @keyframes beat {
      0%,100% { transform: scale(1); } 25% { transform: scale(1.08); }
      50% { transform: scale(1); } 75% { transform: scale(1.05); }
    }
    @keyframes shake {
      0%,100% { transform: rotate(0) scale(1); }
      20% { transform: rotate(-7deg) scale(1.08); }
      40% { transform: rotate(7deg)  scale(1.1); }
      60% { transform: rotate(-5deg) scale(1.07); }
      80% { transform: rotate(5deg)  scale(1.06); }
    }
    .box.bump { animation: shake .4s ease; }
    @keyframes pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }

    /* mảnh pháo giấy & tim bắn ra */
    .fx { position: absolute; top: 50%; left: 50%; z-index: 10; pointer-events: none; will-change: transform, opacity; }
    .confetti { position: absolute; top: -20px; z-index: 10; pointer-events: none; border-radius: 2px; }

    /* chữ cute bay lên */
    .word {
      position: absolute; top: 40%; left: 50%; z-index: 11;
      font-family: 'Pacifico', cursive; font-weight: bold;
      pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="box" id="box">
      <div class="letter">L</div>
      <span class="spark">✨</span>
      <span class="spark">⭐</span>
      <span class="spark">🌟</span>
      <span class="spark">✨</span>
      <div class="half left"><div class="heart"></div></div>
      <div class="half right"><div class="heart"></div></div>
      <div class="dots">
        <span>🤍</span><span>🤍</span><span>🤍</span><span>🤍</span><span>🤍</span>
      </div>
      <div class="hint">bấm nhiều lần vào trái tim nhé 💗</div>
      <div class="love-text">I Love You 💗</div>
    </div>
  </div>

  <script>
    const box   = document.getElementById('box');
    const scene = document.querySelector('.scene');
    const dots  = [...document.querySelectorAll('.dots span')];

    const hearts  = ['💗','💕','💖','💓','💝','❤️','🧡','💛','💚','💙','💜'];
    const colors  = ['#ff4d6d','#ffd23f','#3bc9db','#845ef7','#51cf66','#ff922b','#f783ac','#22d3ee'];
    const words   = ['yêu! 🥰','cute!','💖','woo!','xinh!','🌈','✨','muah!'];

    const TARGET = 5;
    let count = 0;
    let finished = false;

    box.addEventListener('click', () => {
      if (finished) { reset(); return; }

      count++;
      bump();
      shiftColor();
      colorBurst();
      floatWord();
      if (dots[count - 1]) dots[count - 1].textContent = '💖', dots[count - 1].classList.add('on');

      if (count >= TARGET) finale();
    });

    function bump() {
      box.classList.remove('bump');
      void box.offsetWidth;           // reset animation
      box.classList.add('bump');
    }

    function shiftColor() {
      box.style.setProperty('--h', Math.round((count / TARGET) * 320 + 340) % 360);
    }

    function colorBurst() {
      const n = 16;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('span');
        const angle = Math.random() * Math.PI * 2;
        const dist  = 90 + Math.random() * 150;
        const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;

        if (Math.random() < 0.5) {
          el.className = 'fx';
          el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          el.style.fontSize = (14 + Math.random() * 18) + 'px';
        } else {
          el.className = 'fx';
          const s = 8 + Math.random() * 8;
          el.style.width = s + 'px';
          el.style.height = (s * 1.4) + 'px';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.borderRadius = '2px';
        }
        scene.appendChild(el);
        el.animate([
          { transform: 'translate(-50%,-50%) translate(0,0) scale(.3) rotate(0)', opacity: 1 },
          { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1.2) rotate(${Math.random()*360}deg)`, opacity: 0 }
        ], { duration: 800 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
        setTimeout(() => el.remove(), 1400);
      }
    }

    function floatWord() {
      const w = document.createElement('div');
      w.className = 'word';
      w.textContent = words[Math.floor(Math.random() * words.length)];
      w.style.color = colors[Math.floor(Math.random() * colors.length)];
      w.style.fontSize = (20 + Math.random() * 14) + 'px';
      const off = (Math.random() * 80 - 40);
      scene.appendChild(w);
      w.animate([
        { transform: `translate(-50%,-50%) translate(${off}px,0) scale(.6)`, opacity: 0 },
        { transform: `translate(-50%,-50%) translate(${off}px,-40px) scale(1.1)`, opacity: 1, offset: .3 },
        { transform: `translate(-50%,-50%) translate(${off}px,-120px) scale(1)`, opacity: 0 }
      ], { duration: 1200, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => w.remove(), 1300);
    }

    function finale() {
      finished = true;
      box.classList.add('open');
      for (let k = 0; k < 3; k++) setTimeout(colorBurst, k * 150);
      confettiRain();
      box.querySelector('.hint').textContent = '';
    }

    function confettiRain() {
      const n = 70;
      for (let i = 0; i < n; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        const s = 7 + Math.random() * 9;
        c.style.width = s + 'px';
        c.style.height = (s * 1.5) + 'px';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(c);
        c.animate([
          { transform: `translateY(-20px) rotate(0)`, opacity: 1 },
          { transform: `translateY(100vh) rotate(${Math.random()*720-360}deg)`, opacity: .9 }
        ], { duration: 1800 + Math.random() * 1600, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
        setTimeout(() => c.remove(), 3600);
      }
    }

    function reset() {
      finished = false;
      count = 0;
      box.classList.remove('open');
      box.style.setProperty('--h', 340);
      dots.forEach(d => { d.textContent = '🤍'; d.classList.remove('on'); });
      box.querySelector('.hint').textContent = 'bấm nhiều lần vào trái tim nhé 💗';
    }
  </script>
</body>
</html>
